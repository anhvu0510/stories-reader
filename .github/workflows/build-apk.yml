name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  detect:
    name: Detect If APK Build Is Required
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check trigger conditions
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          # 1. Manual trigger always builds
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✔ Triggered manually via workflow_dispatch"
            exit 0
          fi

          # 2. Check if commit message contains [apk] or [build-apk]
          if echo "$COMMIT_MSG" | grep -qiE '\[apk\]|\[build-apk\]'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✔ Commit message contains [apk] tag"
            exit 0
          fi

          # 3. Check if any file under android/ or capacitor config changed
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(android/|capacitor\.config\.)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✔ Detected changes in android/ native code or configuration"
            exit 0
          fi

          echo "should_build=false" >> "$GITHUB_OUTPUT"
          echo "ℹ No native changes detected. Skipping APK build."

  build-apk:
    name: Build Android APK
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(node -p "require('../package.json').version || '1.0.0'")
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/StoriesReader-v${VERSION}.apk
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoriesReader-v${{ env.APP_VERSION }}
          path: android/release-output/StoriesReader-v${{ env.APP_VERSION }}.apk
          retention-days: 30

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '5379136611:AAFvX2godRHlok9qzbU9ROxA0JJruumAlps' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '898218742' }}
        run: |
          APK_FILE="android/release-output/StoriesReader-v${{ env.APP_VERSION }}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to Telegram..."
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            CAPTION=$(printf "📱 *Stories Reader v%s*\n🚀 *Build APK thành công!*\n📝 Commit: \`%s\`\n⚡ Tải file APK đính kèm và cài đặt trực tiếp trên Android." "${{ env.APP_VERSION }}" "${COMMIT_MSG}")

            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@${APK_FILE}" \
                 -F "caption=${CAPTION}" \
                 -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
            echo "✔ Sent APK to Telegram successfully!"
          else
            echo "❌ APK file not found at $APK_FILE"
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Stories Reader v${{ env.APP_VERSION }}
          body: |
            ## 📱 Stories Reader v${{ env.APP_VERSION }}
            - Commit: `${{ github.event.head_commit.message }}`
            - ⚡ Tải file APK đính kèm bên dưới và cài đặt trực tiếp trên Android.
          files: android/release-output/StoriesReader-v${{ env.APP_VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
