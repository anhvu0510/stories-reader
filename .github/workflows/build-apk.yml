name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/deploy.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(node -p "require('../package.json').version || '1.0.0'")
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/StoriesReader-v${VERSION}.apk
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoriesReader-v${{ env.APP_VERSION }}
          path: android/release-output/StoriesReader-v${{ env.APP_VERSION }}.apk
          retention-days: 30

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '5379136611:AAFvX2godRHlok9qzbU9ROxA0JJruumAlps' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '898218742' }}
        run: |
          APK_FILE="android/release-output/StoriesReader-v${{ env.APP_VERSION }}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to Telegram..."
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            CAPTION="📱 *Stories Reader v${{ env.APP_VERSION }}*
🚀 *Build APK thành công!*
📝 Commit: \`${COMMIT_MSG}\`
⚡ Tải file APK đính kèm và cài đặt trực tiếp trên Android."

            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@${APK_FILE}" \
                 -F "caption=${CAPTION}" \
                 -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
            echo "✔ Sent APK to Telegram successfully!"
          else
            echo "❌ APK file not found at $APK_FILE"
            exit 1
          fi
