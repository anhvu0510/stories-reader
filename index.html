    <title>Reader Stories App</title>
    <script>
      // Prevent pinch-to-zoom gesture on mobile browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      // Prevent double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener(
        'touchend',
        function (e) {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );
    </script>
